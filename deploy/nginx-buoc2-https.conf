#
# ============================================================================
#  nginx BƯỚC 2 — CẤU HÌNH CHÍNH THỨC
#  Đích:  /etc/nginx/sites-available/khoathongminhchinhhang.vn  (ghi đè bước 1)
# ============================================================================
#
#  Chỉ cài file này SAU KHI đã có chứng chỉ ở
#  /etc/letsencrypt/live/khoathongminhchinhhang.vn/
#  Chưa có chứng chỉ mà reload là nginx BÁO LỖI VÀ TỪ CHỐI NẠP CẤU HÌNH —
#  nginx cũ vẫn chạy nên 8 website kia không chết, nhưng nhớ luôn chạy
#  "nginx -t" trước khi reload.
#
#  BỐ CỤC:
#     http  (cả 4 tên miền)        -> 301 sang https
#     https://www...               -> 301 sang không www  (gộp SEO về một bản)
#     https://khoathongminh...      -> Next.js web    127.0.0.1:3100
#     https://admin...              -> Next.js admin  127.0.0.1:3101
#     https://api...                -> NestJS         127.0.0.1:4100
#     /media/...                    -> nginx đọc THẲNG từ đĩa (không qua Node)
#
#  Cổng 4100/3100/3101 chứ không phải 4000/3000/3001: trên VPS này cổng 4000
#  đang là hhvn-api và 3001 là app khác, đụng cổng là app không bật lên được.
#
#  Viết theo cú pháp nginx 1.18 (bản của Ubuntu 22.04):
#  dùng "listen 443 ssl http2;" chứ KHÔNG dùng "http2 on;" (chỉ có từ 1.25.1).
# ============================================================================

# Cho WebSocket đi qua proxy. Đặt tên riêng có tiền tố ktm_ để chắc chắn
# không trùng biến map của 8 site đang có.
map $http_upgrade $ktm_connection_upgrade {
    default upgrade;
    ''      close;
}

# ---------------------------------------------------------------------------
# 1. HTTP -> HTTPS
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;

    server_name khoathongminhchinhhang.vn
                www.khoathongminhchinhhang.vn
                admin.khoathongminhchinhhang.vn
                api.khoathongminhchinhhang.vn;

    # Giữ lại để certbot gia hạn tự động (3 tháng/lần) vẫn chạy được
    location /.well-known/acme-challenge/ {
        root /var/www/khoathongminhchinhhang.vn/acme;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------------------------------------
# 2. www -> không www
#
#  Hai tên miền cùng nội dung sẽ chia đôi điểm SEO và làm cookie đăng nhập
#  lệch nhau. Chọn bản KHÔNG www làm bản chính.
# ---------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.khoathongminhchinhhang.vn;

    ssl_certificate     /etc/letsencrypt/live/khoathongminhchinhhang.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/khoathongminhchinhhang.vn/privkey.pem;
    ssl_session_timeout 1d;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    return 301 https://khoathongminhchinhhang.vn$request_uri;
}

# ---------------------------------------------------------------------------
# 3. WEBSITE BÁN HÀNG
# ---------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name khoathongminhchinhhang.vn;

    ssl_certificate     /etc/letsencrypt/live/khoathongminhchinhhang.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/khoathongminhchinhhang.vn/privkey.pem;
    ssl_session_timeout 1d;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # 180 ngày, KHÔNG includeSubDomains: tránh ép HTTPS lên những tên miền con
    # có thể dùng cho việc khác về sau.
    add_header Strict-Transport-Security "max-age=15552000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Trang chi tiết sản phẩm có HTML dài, nén lại tiết kiệm đáng kể
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript
               application/x-javascript text/xml application/xml
               application/xml+rss text/javascript image/svg+xml;

    # --- ẢNH: nginx đọc thẳng từ đĩa -------------------------------------
    # Database lưu đường dẫn tương đối "/media/...", nên mỗi tên miền phải tự
    # phục vụ được /media. Đọc từ đĩa nhanh hơn nhiều so với đi vòng qua
    # Next.js rồi sang NestJS (đó chỉ là phương án dự phòng lúc chạy máy nhà).
    location /media/ {
        alias /var/www/khoathongminhchinhhang.vn/media/;
        access_log off;
        # Tên file ảnh có mã băm nên nội dung không bao giờ đổi -> cache 30 ngày.
        # LƯU Ý: add_header đặt trong location sẽ XOÁ hết add_header của khối
        # server bên ngoài, nên phải khai lại HSTS ở đây, không thì riêng ảnh
        # trả về thiếu header đó. (Đã kiểm tra bằng nginx thật.)
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        add_header Strict-Transport-Security "max-age=15552000" always;
        try_files $uri =404;
    }

    # --- File tĩnh của Next.js -------------------------------------------
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3100;
        proxy_set_header Host $host;
        access_log off;
        # /_next/static/ luôn có mã build trong đường dẫn -> cache 1 năm
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Strict-Transport-Security "max-age=15552000" always;
    }

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $ktm_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 60s;
        # Next.js tự nén và tự quản cache, nginx đừng đệm lại giữa đường
        proxy_buffering off;
    }
}

# ---------------------------------------------------------------------------
# 4. TRANG QUẢN TRỊ
# ---------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name admin.khoathongminhchinhhang.vn;

    ssl_certificate     /etc/letsencrypt/live/khoathongminhchinhhang.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/khoathongminhchinhhang.vn/privkey.pem;
    ssl_session_timeout 1d;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=15552000" always;
    add_header X-Content-Type-Options "nosniff" always;
    # Trang quản trị không có lý do gì để xuất hiện trên Google
    add_header X-Robots-Tag "noindex, nofollow" always;

    # Khớp MEDIA_MAX_SIZE_MB=20, cộng dư cho phần bao gói multipart
    client_max_body_size 25m;

    location /media/ {
        alias /var/www/khoathongminhchinhhang.vn/media/;
        access_log off;
        # Tên file ảnh có mã băm nên nội dung không bao giờ đổi -> cache 30 ngày.
        # LƯU Ý: add_header đặt trong location sẽ XOÁ hết add_header của khối
        # server bên ngoài, nên phải khai lại HSTS ở đây, không thì riêng ảnh
        # trả về thiếu header đó. (Đã kiểm tra bằng nginx thật.)
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        add_header Strict-Transport-Security "max-age=15552000" always;
        try_files $uri =404;
    }

    location /_next/static/ {
        proxy_pass http://127.0.0.1:3101;
        proxy_set_header Host $host;
        access_log off;
        # /_next/static/ luôn có mã build trong đường dẫn -> cache 1 năm
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Strict-Transport-Security "max-age=15552000" always;
    }

    location / {
        proxy_pass http://127.0.0.1:3101;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $ktm_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        # Nhập hàng loạt từ file Excel có thể chạy lâu
        proxy_read_timeout 300s;
        proxy_buffering off;
    }
}

# ---------------------------------------------------------------------------
# 5. API
# ---------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.khoathongminhchinhhang.vn;

    ssl_certificate     /etc/letsencrypt/live/khoathongminhchinhhang.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/khoathongminhchinhhang.vn/privkey.pem;
    ssl_session_timeout 1d;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=15552000" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    client_max_body_size 25m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types application/json text/plain;

    # Ảnh cũng phục vụ ở đây, cho tương thích với bản ghi cũ còn lưu đường
    # dẫn đầy đủ dạng http://.../media/...
    location /media/ {
        alias /var/www/khoathongminhchinhhang.vn/media/;
        access_log off;
        # Tên file ảnh có mã băm nên nội dung không bao giờ đổi -> cache 30 ngày.
        # LƯU Ý: add_header đặt trong location sẽ XOÁ hết add_header của khối
        # server bên ngoài, nên phải khai lại HSTS ở đây, không thì riêng ảnh
        # trả về thiếu header đó. (Đã kiểm tra bằng nginx thật.)
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        add_header Strict-Transport-Security "max-age=15552000" always;
        try_files $uri =404;
    }

    location / {
        proxy_pass http://127.0.0.1:4100;
        proxy_http_version 1.1;

        # BẮT BUỘC cho WebSocket (Socket.IO của NestJS chạy ở đây).
        # Thiếu hai dòng này, nginx chuyển tiếp như yêu cầu HTTP thường và không
        # bắt tay nâng cấp giao thức -> trình duyệt báo "WebSocket connection
        # failed", Socket.IO lùi về chế độ hỏi liên tục: vẫn chạy nhưng tốn
        # kết nối và chậm hơn nhiều.
        # $ktm_connection_upgrade khai ở khối map đầu file này.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $ktm_connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Kết nối WebSocket nằm im giữa hai nhịp ping. Socket.IO ping mỗi 25
        # giây nên 300s vốn đã đủ, nhưng để 1 giờ cho chắc: nginx cắt giữa
        # chừng thì client phải nối lại, người dùng thấy giao diện khựng.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        proxy_buffering off;
    }
}
