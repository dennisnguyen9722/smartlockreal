#
# ============================================================================
#  nginx BƯỚC 1 — CHỈ ĐỂ LẤY CHỨNG CHỈ SSL
#  Đích:  /etc/nginx/sites-available/khoathongminhchinhhang.vn
# ============================================================================
#
#  File này cố tình làm được ĐÚNG MỘT VIỆC: trả lời thử thách ACME của
#  Let's Encrypt. Chưa proxy gì cả, vì lúc này 4 app còn chưa build.
#
#  TẠI SAO TÁCH LÀM HAI BƯỚC, KHÔNG DÙNG "certbot --nginx"?
#  certbot --nginx sẽ TỰ SỬA file cấu hình nginx. Trên VPS đang chạy 8 website
#  khác, mình không muốn certbot tự ý viết vào bất cứ file nào. Dùng
#  "certbot certonly --webroot" thì certbot chỉ ghi chứng chỉ vào
#  /etc/letsencrypt, không chạm tới cấu hình nginx. Sau khi có chứng chỉ,
#  mình thay file này bằng nginx-buoc2-https.conf.
#
#  File này KHÔNG có "default_server", nên nginx chỉ dùng nó khi tên miền
#  khớp đúng — 8 site kia hoàn toàn không bị ảnh hưởng.
# ============================================================================

server {
    listen 80;
    listen [::]:80;

    server_name khoathongminhchinhhang.vn
                www.khoathongminhchinhhang.vn
                admin.khoathongminhchinhhang.vn
                api.khoathongminhchinhhang.vn;

    # Let's Encrypt đặt file thử thách vào thư mục này
    location /.well-known/acme-challenge/ {
        root /var/www/khoathongminhchinhhang.vn/acme;
        default_type "text/plain";
        try_files $uri =404;
    }

    # Mọi đường dẫn khác: báo đang cài đặt. Trả 503 (không phải 200) để
    # Google có vô tình ghé qua lúc này cũng không lập chỉ mục trang trắng.
    location / {
        add_header Content-Type "text/plain; charset=utf-8" always;
        add_header Retry-After 3600 always;
        return 503 "Website dang duoc cai dat, vui long quay lai sau.\n";
    }
}
