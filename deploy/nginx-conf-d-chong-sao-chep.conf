#
# =============================================================================
#  KHAI BÁO DÙNG CHUNG CHO VIỆC CHỐNG SAO CHÉP
#  Đích:  /etc/nginx/conf.d/ktm-chong-sao-chep.conf
# =============================================================================
#
#  VÌ SAO PHẢI LÀ MỘT FILE RIÊNG TRONG conf.d
#  Bốn thứ dưới đây — geo, map, limit_req_zone, limit_conn_zone — chỉ khai được
#  ở mức "http", tức là bên trong nginx.conf, file DÙNG CHUNG của 8 website
#  khác trên VPS này. Thay vì sửa file đó, đặt một file MỚI vào conf.d: nginx
#  tự nạp nó vào đúng mức http. Thêm, không sửa — như mọi lần.
#
#  FILE NÀY TỰ NÓ KHÔNG LÀM GÌ CẢ.
#  Nó chỉ ĐỊNH NGHĨA. Giới hạn chỉ có hiệu lực ở nơi nào gọi limit_req /
#  limit_conn, mà chỉ các khối server của khoathongminhchinhhang.vn mới gọi.
#  8 website kia hoàn toàn không bị ảnh hưởng.
# =============================================================================


# -----------------------------------------------------------------------------
# 1. MIỄN TRỪ CHO CHÍNH MÁY CHỦ NÀY — phần quan trọng nhất file, đừng bỏ
#
# Website dựng trang ở phía máy chủ (SSR): Next.js gọi
# https://api.khoathongminhchinhhang.vn, tên miền đó trỏ về chính VPS này, nên
# yêu cầu đi ra rồi vòng ngược lại. Dưới mắt nginx, TOÀN BỘ lượt dựng trang của
# MỌI khách đều đến từ MỘT địa chỉ IP duy nhất — IP của chính VPS.
#
# Không miễn trừ địa chỉ đó thì chỉ cần vài khách vào cùng lúc là chạm trần,
# nginx trả 429 cho chính website của mình. Tự bóp cổ mình.
#
# Khoá rỗng ("") = KHÔNG tính vào giới hạn nào.
# -----------------------------------------------------------------------------
geo $ktm_mien_tru {
    default            0;
    127.0.0.1/32       1;
    ::1/128            1;
    14.225.222.242/32  1;   # IP công khai của VPS — sửa nếu đổi máy chủ
}

map $ktm_mien_tru $ktm_khoa_ip {
    0 $binary_remote_addr;
    1 "";
}


# -----------------------------------------------------------------------------
# 2. CÁC VÙNG ĐẾM
#
# 10m bộ nhớ đủ cho khoảng 160.000 địa chỉ IP — thừa sức.
#
# ktm_trang  5 lượt/giây:  người thật mở một trang tốn 1-3 lượt ở đây (ảnh và
#                          file tĩnh nằm ở location khác, không tính vào đây).
# ktm_api   10 lượt/giây:  rộng hơn vì trang lọc sản phẩm gọi API liên tục.
# ktm_ketnoi            :  số kết nối ĐỒNG THỜI, chặn kiểu tải hàng loạt.
# -----------------------------------------------------------------------------
limit_req_zone  $ktm_khoa_ip  zone=ktm_trang:10m   rate=5r/s;
limit_req_zone  $ktm_khoa_ip  zone=ktm_api:10m     rate=10r/s;
limit_conn_zone $ktm_khoa_ip  zone=ktm_ketnoi:10m;


# -----------------------------------------------------------------------------
# 3. KHUÔN GHI NHẬT KÝ CHO ĐÈN BÁO SAO CHÉP
#
# Chỉ ghi đúng thứ cần cho việc đối chiếu sau này: thời điểm, IP của người xem
# bản sao, tham số (có tên miền lạ), và trình duyệt. Không ghi gì thêm.
# log_format chỉ khai được ở mức http nên phải nằm trong file này.
# -----------------------------------------------------------------------------
log_format ktm_bao '$time_iso8601  ip=$remote_addr  $request_uri  ua="$http_user_agent"';


# -----------------------------------------------------------------------------
# 4. NHẬN DIỆN CÔNG CỤ SAO CHÉP CẢ WEBSITE
#
# Khoá ghép "miễn trừ:tên công cụ" nên máy chủ tự gọi mình thì không bao giờ
# bị chặn, dù công cụ nào.
#
# CỐ Ý KHÔNG CHẶN:
#   curl          - mình còn dùng để kiểm tra, và script deploy cũng dùng
#   node, undici  - Next.js dùng để gọi API khi dựng trang
#   Googlebot, bingbot, các bot tìm kiếm - chặn là tự giết SEO
#   python-requests, axios - quá phổ biến, chặn dễ gãy tích hợp thật
#
# Danh sách dưới đây chỉ gồm công cụ mà lý do tồn tại của nó là TẢI CẢ WEBSITE
# VỀ MÁY. Không có lý do chính đáng nào để chúng ghé website bán hàng.
# -----------------------------------------------------------------------------
map "$ktm_mien_tru:$http_user_agent" $ktm_cong_cu_sao_chep {
    default 0;
    "~*^0:.*(httrack|httraqt|webcopier|web\s*copier|webzip|teleport\s*pro|offline\s*explorer|sitesucker|webreaper|website\s*downloader|web\s*downloader|grab-site|webstripper|wget|xenu|webwhacker|copyrightcheck|zeus)" 1;
}
